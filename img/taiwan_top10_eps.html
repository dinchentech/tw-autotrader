function fpct(v) { if(v==null)return'—';var s=v>=0?'+':'';var c=v>0?'price-up':(v<0?'price-down':'price-same');return'<span class="'+c+'">'+s+v.toFixed(2)+'%</span>'; }

const codes=Object.keys(stocksData);
const colors=['#60a5fa','#34d399','#fbbf24','#f472b6','#a78bfa','#fb923c','#22d3ee','#f87171','#a3e635','#e879f9'];

var tEPS=0,mEPS=0,mEN='';
codes.forEach(function(c){ tEPS+=stocksData[c].eps; if(stocksData[c].eps>mEPS){mEPS=stocksData[c].eps;mEN=stocksData[c].name;} });
var aEPS=(tEPS/codes.length).toFixed(2);

var priceTr=[], normTr=[], epsVals=[], epsLbls=[];
codes.forEach(function(c,i){
    var s=stocksData[c];
    var dates=s.data.map(function(d){return d.date.split('T')[0];});
    var cls=s.data.map(function(d){return d.close;});
    var bp=cls[0];
    
    // For tooltip show EPS
    var lbl=s.name+'('+c+') EPS='+s.eps.toFixed(2);
    
    priceTr.push({
        x:dates, y:cls, type:'scatter', mode:'lines',
        name:lbl,
        line:{color:colors[i%10],width:2},
        hovertemplate:'%{x}<br>'+s.name+'('+c+'): NT$%{y:,.2f}<extra></extra>'
    });
    
    var nm=cls.map(function(v){return(v-bp)/bp*100;});
    normTr.push({
        x:dates, y:nm, type:'scatter', mode:'lines',
        name:lbl,
        line:{color:colors[i%10],width:2},
        hovertemplate:'%{x}<br>'+s.name+'('+c+'): %{y:.2f}%<extra></extra>'
    });
    
    epsVals.push(s.eps);
    epsLbls.push(s.name+'('+c+')');
});

var lo={
    paper_bgcolor:'#1e293b', plot_bgcolor:'#1e293b',
    font:{color:'#e2e8f0', family:'"Noto Sans TC",sans-serif'},
    xaxis:{gridcolor:'#334155', zerolinecolor:'#334155', title:{text:'日期'}, tickfont:{size:11}},
    yaxis:{gridcolor:'#334155', zerolinecolor:'#334155', tickfont:{size:11}},
    legend:{orientation:'h', y:-0.25, font:{size:10}, bgcolor:'rgba(0,0,0,0)'},
    margin:{t:20, r:20, b:110, l:60},
    hovermode:'x unified'
};
var loP=Object.assign({},lo); loP.yaxis.title={text:'股價(NT$)'};
Plotly.newPlot('priceChart',priceTr,loP);

var loN=Object.assign({},lo); loN.yaxis={gridcolor:'#334155', zerolinecolor:'#f472b6', tickfont:{size:11}, title:{text:'漲跌幅(%)'}};
Plotly.newPlot('normalizedChart',normTr,loN);

Plotly.newPlot('epsChart',[{
    x:epsLbls, y:epsVals, type:'bar',
    marker:{color:colors.slice(0,10)},
    text:epsVals.map(function(v){return 'NT$'+v.toFixed(2);}),
    textposition:'outside', textfont:{color:'#e2e8f0', size:11},
    hovertemplate:'%{x}<br>EPS: NT$%{y:,.2f}<extra></extra>'
}],{
    paper_bgcolor:'#1e293b', plot_bgcolor:'#1e293b',
    font:{color:'#e2e8f0', family:'"Noto Sans TC",sans-serif'},
    xaxis:{gridcolor:'#334155', tickangle:-30},
    yaxis:{gridcolor:'#334155', title:{text:'每股盈餘 (NT$)'}},
    margin:{t:20, r:20, b:120, l:60}
});

var tb='';
codes.forEach(function(c,i){
    var s=stocksData[c], t=tableData[i];
    var sn=(t.change>=0?'+':'');
    var cn=t.change>0?'price-up':'price-down';
    tb+='<tr><td><span class="rank">#'+(i+1)+'</span></td>'
       +'<td class="stock-name">'+s.name+'</td><td>'+c+'</td>'
       +'<td class="eps-high">NT$'+s.eps.toFixed(2)+'</td><td>—</td>'
       +'<td>'+fp(t.last)+'</td>'
       +'<td class="'+cn+'">'+sn+t.change.toFixed(2)+'</td>'
       +'<td>'+fpct(t.pct)+'</td></tr>';
});
document.getElementById('tableBody').innerHTML=tb;

document.getElementById('statsRow').innerHTML=''
    +'<div class="stat-card"><div class="num">'+codes.length+'</div><div class="label">股票數量</div></div>'
    +'<div class="stat-card"><div class="num">NT$ '+aEPS+'</div><div class="label">平均 EPS</div></div>'
    +'<div class="stat-card"><div class="num">NT$ '+mEPS.toFixed(2)+'</div><div class="label">最高 EPS</div><div class="sub">'+mEN+'</div></div>';
</script>
</body>
</html>
