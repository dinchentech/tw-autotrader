  const volChart = LightweightCharts.createChart(document.getElementById("vol-" + sid), {
    layout: { background: { color: "transparent" }, textColor: "#8899aa" },
    grid: { vertLines: { color: "#1a1a2e" }, horzLines: { color: "#1a1a2e" } },
    rightPriceScale: { borderColor: "#2a3a5e" },
    timeScale: { borderColor: "#2a3a5e", visible: false },
  });
  const volSeries = volChart.addHistogramSeries({ priceFormat: { type: "volume" } });
  volSeries.setData(d.vol.map(v => ({ ...v, color: v.value > 0 ? "#26a69a55" : "#ef535055" })));

  const first = d.candles[0], last = d.candles[d.candles.length - 1];
  const pct = ((last.close - first.open) / first.open) * 100;
  const hi = Math.max(...d.candles.map(c => c.high));
  const lo = Math.min(...d.candles.map(c => c.low));
  const volSum = d.vol.reduce((a, b) => a + b.value, 0);
  document.getElementById("meta-" + sid).textContent = `${fmtDate(first.time)} ~ ${fmtDate(last.time)}`;
  document.getElementById("sum-" + sid).innerHTML =
    `<span>半年漲跌：<b class="${pct >= 0 ? "up" : "down"}">${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%</b></span>` +
    `<span>最新收盤：<b>${last.close.toFixed(2)}</b></span>` +
    `<span>期間高/低：<b>${hi.toFixed(2)}</b> / <b>${lo.toFixed(2)}</b></span>` +
    `<span>期間成交量：<b>${formatMoney(volSum)}</b></span>`;
  chart.timeScale().fitContent();
  volChart.timeScale().fitContent();
}

for (const sid of STOCKS) {
  try {
    renderStock(sid);
  } catch (e) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h2>${sid} ${DATA[sid].name}</h2><div class="meta" style="color:#ef5350">⚠️ 圖表渲染失敗：${e.message}</div>`;
    grid.appendChild(card);
  }
}
</script>
</body>
</html>
